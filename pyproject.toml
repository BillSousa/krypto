[project]
name = "krypto"
version = "0.1.0"
description = "A Python implementation of the classic mathematics card game"
readme = "README.md"
authors = [
    { name = "Bill Sousa", email = "WKSJR99@msn.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
krypto = "krypto:main"

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "krypto",
    "jupyter",
    "notebook",
]
test = [
    "pytest>=7.0.0; python_version == '3.10'",
    "pytest>=7.0.0; python_version == '3.11'",
    "pytest>=7.0.0; python_version == '3.12'",
    "pytest>=7.0.0; python_version == '3.13'",
    "pytest>=8.0.0; python_version == '3.14'",
    "pytest>=8.0.0; python_version == '3.15'",
    "pytest-cov>=6.0.0",
    "pytest-html",
    "coverage>=7.6.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
